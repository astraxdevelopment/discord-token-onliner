<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord RPC Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; margin: 0; padding: 30px; display: flex; flex-direction: column; min-height: 90vh; }
    h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; font-weight: 600; }
    .wrapper { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; width: 100%; flex: 1; }
    .box { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .box h3 { margin-top: 0; border-bottom: 1px solid #1f2937; padding-bottom: 10px; color: #a5b4fc; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #374151; background: #030712; color: #fff; box-sizing: border-box; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; margin-top: 15px; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #1f2937; color: #9ca3af; font-size: 13px; }
    footer a { color: #38bdf8; text-decoration: none; margin: 0 10px; font-weight: 500; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Discord Multi-RPC Controller</h1>
  
  <div class="wrapper">
    {% for acc in accounts %}
    <div class="box">
      <h3>{{ acc.label }}</h3>
      <form action="/update" method="POST">
        <input type="hidden" name="index" value="{{ loop.index0 }}">
        
        <div class="field">
          <label>Token</label>
          <input type="password" name="token" value="{{ acc.token }}" required>
        </div>

        <div class="field">
          <label>Proxy (Optional)</label>
          <input type="text" name="proxy" value="{{ acc.proxy or '' }}" placeholder="http://user:pass@ip:port">
        </div>

        <div class="split">
          <div class="field">
            <label>Status</label>
            <select name="status">
              <option value="online" {% if acc.status == 'online' %}selected{% endif %}>Online</option>
              <option value="idle" {% if acc.status == 'idle' %}selected{% endif %}>Idle</option>
              <option value="dnd" {% if acc.status == 'dnd' %}selected{% endif %}>DND</option>
              <option value="invisible" {% if acc.status == 'invisible' %}selected{% endif %}>Invisible</option>
            </select>
          </div>
          <div class="field">
            <label>Device</label>
            <select name="device">
              <option value="desktop" {% if acc.device == 'desktop' %}selected{% endif %}>Desktop</option>
              <option value="mobile" {% if acc.device == 'mobile' %}selected{% endif %}>Mobile</option>
              <option value="web" {% if acc.device == 'web' %}selected{% endif %}>Web</option>
              <option value="embedded" {% if acc.device == 'embedded' %}selected{% endif %}>Embedded</option>
            </select>
          </div>
        </div>

        <div class="split">
          <div class="field">
            <label>Activity Type</label>
            <select name="rpc_type">
              <option value="playing" {% if acc.rpc.type == 'playing' %}selected{% endif %}>Playing</option>
              <option value="streaming" {% if acc.rpc.type == 'streaming' %}selected{% endif %}>Streaming</option>
              <option value="listening" {% if acc.rpc.type == 'listening' %}selected{% endif %}>Listening</option>
              <option value="watching" {% if acc.rpc.type == 'watching' %}selected{% endif %}>Watching</option>
            </select>
          </div>
          <div class="field">
            <label>Name</label>
            <input type="text" name="rpc_name" value="{{ acc.rpc.name }}">
          </div>
        </div>

        <div class="field">
          <label>Details</label>
          <input type="text" name="rpc_details" value="{{ acc.rpc.details }}">
        </div>

        <div class="field">
          <label>State</label>
          <input type="text" name="rpc_state" value="{{ acc.rpc.state }}">
        </div>

        <button type="submit">Save & Apply</button>
      </form>
    </div>
    {% endfor %}
  </div>

  <footer>
    <span>Educational Project &bull;</span>
    <a href="https://discord.gg/TpHEZKTra" target="_blank">Discord Server</a> |
    <a href="https://tocka.mysellauth.com" target="_blank">Store Website</a>
  </footer>
</body>
</html>
